version: '3.9'
services:
  postgres:
    image: postgres:15
    container_name: av_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: av_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: av_erp_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
